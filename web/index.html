<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentFinX</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen" class="screen active">
  <div class="auth-logo">
    <div class="icon"></div>
    <span>Agent<b>Fin-X</b></span>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="auth-tab" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form" class="auth-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="ban@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="login-err" class="auth-err"></div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Đăng nhập</button>
      <div class="auth-divider"><span>hoặc</span></div>
      <button class="btn-google" onclick="doGoogleLogin()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Tiếp tục với Google
      </button>
      <!-- Tài khoản demo -->
      <div style="text-align:center;margin-top:8px;">
        <small style="color:var(--text4);font-size:12px;">Demo: <b>demo@ftu.vn</b> / <b>123456</b></small>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="register-form" class="auth-form hidden">
      <div class="field">
        <label>Họ và tên</label>
        <input type="text" id="reg-name" placeholder="Nguyễn Văn A" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="ban@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input type="password" id="reg-pass" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="reg-pass2" placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
      </div>
      <div id="reg-err" class="auth-err"></div>
      <button class="btn-primary" id="reg-btn" onclick="doRegister()">Tạo tài khoản</button>
      <div class="auth-divider"><span>hoặc</span></div>
      <button class="btn-google" onclick="doGoogleLogin()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Tiếp tục với Google
      </button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API = 'http://localhost:8000';   // ← đổi nếu deploy server khác

// ── HELPERS ─────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register'));
  });
  document.getElementById('login-form').classList.toggle('hidden', tab!=='login');
  document.getElementById('register-form').classList.toggle('hidden', tab!=='register');
  ['login-err','reg-err'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '';
    el.classList.remove('show');
  });
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? 'Đang xử lý...' : (btnId === 'login-btn' ? 'Đăng nhập' : 'Tạo tài khoản');
}

// ── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) { showErr('login-err','Vui lòng nhập đầy đủ thông tin.'); return; }

  setLoading('login-btn', true);
  try {
    const res  = await fetch(`${API}/api/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (!res.ok) { showErr('login-err', data.detail || 'Đăng nhập thất bại.'); return; }
    saveAndRedirect(data);
  } catch(e) {
    showErr('login-err','Không kết nối được server. Kiểm tra backend đã chạy chưa.');
  } finally {
    setLoading('login-btn', false);
  }
}

// ── REGISTER ──────────────────────────────────────────────────────────────────
async function doRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;

  if (!name||!email||!pass||!pass2) { showErr('reg-err','Vui lòng nhập đầy đủ thông tin.'); return; }
  if (pass.length < 6)  { showErr('reg-err','Mật khẩu tối thiểu 6 ký tự.'); return; }
  if (pass !== pass2)   { showErr('reg-err','Mật khẩu xác nhận không khớp.'); return; }

  setLoading('reg-btn', true);
  try {
    const res  = await fetch(`${API}/api/register`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password: pass })
    });
    const data = await res.json();
    if (!res.ok) { showErr('reg-err', data.detail || 'Đăng ký thất bại.'); return; }
    saveAndRedirect(data);
  } catch(e) {
    showErr('reg-err','Không kết nối được server.');
  } finally {
    setLoading('reg-btn', false);
  }
}

// ── GOOGLE (fake demo) ────────────────────────────────────────────────────────
async function doGoogleLogin() {
  // Tạm dùng tài khoản demo — thay bằng OAuth thật khi có
  document.getElementById('login-email').value = 'demo@ftu.vn';
  document.getElementById('login-pass').value  = '123456';
  await doLogin();
}

// ── SAVE & REDIRECT ───────────────────────────────────────────────────────────
function saveAndRedirect(data) {
  localStorage.setItem('finx_token', data.token);
  localStorage.setItem('finx_user',  JSON.stringify(data.user));
  window.location.href = 'chatbox.html';
}

// ── ENTER KEY ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const isLogin = !document.getElementById('login-form').classList.contains('hidden');
  isLogin ? doLogin() : doRegister();
});

// ── AUTO-REDIRECT nếu đã đăng nhập ───────────────────────────────────────────
if (localStorage.getItem('finx_token')) {
  window.location.href = 'chatbox.html';
}
</script>
</body>
</html>
