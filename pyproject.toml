[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfinx"
version = "0.1.0"
description = "Evidence-first Vietnamese financial-report QA pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=0.21,<2.0",
  "langchain>=1.2,<2.0",
  "langchain-core>=1.3,<2.0",
  "langchain-ollama>=1.0,<2.0",
  "langgraph>=1.1,<2.0",
  # Cloud collection currently runs Qdrant 1.19; stay within one minor version
  # so qdrant-client's compatibility contract does not warn on every query.
  "qdrant-client>=1.18,<2.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1.0",
  "llama-cloud>=2.15,<3.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn>=0.34,<1.0",
]
smoke = ["reportlab>=4.0,<6.0"]
eval = [
  "ragas>=0.3.4,<0.4",
  "datasets>=4.8,<5.0",
  "langchain-anthropic>=1.0,<2.0",
]
dev = [
  "pytest>=7.4,<9.0",
  # scripts/ab_viewer.py — local viewer for routing A/B run directories
  "streamlit>=1.37,<2.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.11,<2.0",
  "detect-secrets>=1.5,<2.0",
]

[project.scripts]
agentfinx = "agentfinx.cli:main"
agentfinx-batch = "dataset_batch_runner:main"
agentfinx-predict = "dataset_batch_result:main"
agentfinx-ragas = "ragas_eval_runner:main"
agentfinx-recall = "eval_retrieval_recall:main"
agentfinx-refresh-symbols = "scripts.refresh_symbol_catalog:main"

[tool.setuptools]
package-dir = {agentfinx = "src/agentfinx"}
packages = [
  "agentfinx",
  "agents",
  "acquisition",
  "config",
  "dataset_catalog",
  "evaluation",
  "graph",
  "ingestion",
  "kb",
  "llm",
  "schemas",
  "scripts",
  "tools",
  "vectorstore",
  "web_evidence",
]
py-modules = [
  "common",
  "test",
  "dataset_batch_runner",
  "dataset_batch_result",
  "ragas_eval_runner",
  "eval_retrieval_recall",
  "analyze_batch_metrics",
  "analyze_prediction_errors",
  "output_formatter",
  "run_rotate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["ragas_runs", "dataset_store"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
exclude = "^(ragas_runs|dataset_store)/"
