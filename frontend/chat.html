<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgenFin-X</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="chatstyle.css" />
</head>
<body class="chat-body">
<a class="skip-link" href="#composerInput">Bỏ qua đến ô nhập tin nhắn</a>

<div class="app-shell" id="appShell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="landing.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 18L9 8L13 15L16 10L20 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">AgenFin<span class="brand-x">-X</span></span>
      </a>
      <button class="icon-btn sidebar-collapse" id="collapseBtn" aria-label="Thu gọn thanh bên">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 4v16M15 8l-4 4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Cuộc trò chuyện mới</span>
    </button>

    <div class="sidebar-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="historySearch" placeholder="Tìm lịch sử trò chuyện" aria-label="Tìm lịch sử trò chuyện" />
    </div>

    <nav class="history-list" id="historyList" aria-label="Lịch sử trò chuyện">
      <p class="history-empty" id="historyEmpty">Chưa có cuộc trò chuyện nào.</p>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-user" id="userMenuBtn" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="userAvatar">A</span>
        <span class="sidebar-user-meta">
          <span class="sidebar-user-name" id="userName">Đang tải…</span>
          <span class="sidebar-user-email" id="userEmail"></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="user-menu" id="userMenu" hidden>

        <button id="logoutMenuItem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Đăng xuất</button>
      </div>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- MAIN -->
  <div class="chat-main">
    <header class="chat-header">
      <button class="icon-btn mobile-sidebar-btn" id="mobileSidebarBtn" aria-label="Mở thanh bên">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <div class="model-selector" id="modelSelector">
        <span class="model-name">AgenFin-X</span>
 
      </div>

      <div class="chat-header-actions">
        <span class="connection-pill" id="connectionPill" title="Trạng thái kết nối backend">
          <span class="dot" id="connectionDot"></span>
          <span id="connectionLabel">Đang kiểm tra…</span>
        </span>
      </div>
    </header>

    <main class="chat-scroll" id="chatScroll">
      <!-- WELCOME STATE -->
      <section class="welcome" id="welcomeState">
        <div class="welcome-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 18L9 8L13 15L16 10L20 6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>Xin chào<span id="greetingName">!</span></h1>
        <p>Tôi có thể phân tích báo cáo tài chính, hãy đính kèm một BCTC hoặc đặt câu hỏi bên dưới.</p>

        
      </section>

      <!-- CONVERSATION -->
      <div class="conversation" id="conversation" hidden></div>
    </main>

    <!-- COMPOSER -->
    <footer class="composer-wrap">
      <div class="composer">
        <div class="attachment-row" id="attachmentRow" hidden></div>

        <form id="composerForm" class="composer-form">
          <button type="button" class="composer-icon-btn" id="attachBtn" aria-label="Đính kèm file">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="m21.44 11.05-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.2-9.19a3.5 3.5 0 1 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="fileInput" accept=".pdf,.xlsx,.csv" hidden />

          <textarea
            id="composerInput"
            class="composer-textarea"
            rows="1"
            placeholder="Nhắn gì đó đi"
            aria-label="Nhập tin nhắn"
          ></textarea>

          <button type="button" class="composer-icon-btn" id="voiceBtn" aria-label="Nhập bằng giọng nói thì khó">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="1.7"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>

          <button type="submit" class="send-btn" id="sendBtn" aria-label="Gửi tin nhắn" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

      </div>
    </footer>
  </div>
</div>

<script src="chatbox.js"></script>
</body>
</html>
