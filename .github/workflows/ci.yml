name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[eval,dev]'
      - run: python -m pytest tests -q
      - run: >-
          python -m compileall -q
          agents config dataset_catalog evaluation graph ingestion kb llm schemas
          scripts tools vectorstore src
          test.py dataset_batch_runner.py dataset_batch_result.py ragas_eval_runner.py
          eval_retrieval_recall.py analyze_batch_metrics.py output_formatter.py run_rotate.py
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/agentfinx-wheel
      - run: detect-secrets scan --all-files --exclude-files '^(ragas_runs|data)/'
